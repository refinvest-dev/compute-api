[project]
name = "refinvest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "liveforpresent", email = "dailynsteady@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
