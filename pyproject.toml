[project]
name = "refinvest"
version = "0.1.0"
description = "Internal, deterministic computation service for refinvest"
readme = "README.md"
authors = [
    { name = "liveforpresent", email = "dailynsteady@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42,<2",
    "cryptography>=46,<51",
    "exchange-calendars>=4.10,<5",
    "fastapi[standard]>=0.141.1",
    "prometheus-client>=0.20,<1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
refinvest = "refinvest:main"
refinvest-backtest-worker = "refinvest.app.worker:worker_main"
refinvest-trading-review-worker = "refinvest.app.trading_review_worker:trading_review_worker_main"
refinvest-trading-analytics-worker = "refinvest.app.trading_analytics_worker:trading_analytics_worker_main"
refinvest-cleanup-trading-review-jobs = "refinvest.app.trading_review_cleanup:trading_review_cleanup_main"
refinvest-cleanup-trading-analytics-jobs = "refinvest.app.trading_analytics_cleanup:trading_analytics_cleanup_main"
refinvest-publish-snapshot = "refinvest.app.snapshot_ingestion:snapshot_ingestion_main"
refinvest-publish-integration-fixture = "refinvest.app.integration_fixture:integration_fixture_main"
refinvest-verify-reference-data = "refinvest.app.reference_data_smoke:reference_data_smoke_main"
refinvest-cleanup-backtest-jobs = "refinvest.app.backtest_job_cleanup:backtest_job_cleanup_main"
refinvest-benchmark = "refinvest.app.benchmark:benchmark_main"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "jsonschema>=4.23,<5",
    "pyright>=1.1.411",
    "pyyaml>=6,<7",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
