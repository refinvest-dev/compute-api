openapi: 3.0.3
info:
  title: compute API
  version: "0.3.0"
  description: |
    Core(`core-api`) → Compute(`compute-api`) 내부 계약.

    - 이 스펙은 `context` 레포가 소유한다. 두 레포 모두 이 스펙을 기준으로 구현하며,
      한쪽 레포만 보고 응답 필드를 추측해 구현하지 않는다(`AI_AGENT.md` §1).
    - Compute는 인터넷에 직접 노출하지 않는다. Core만 호출 가능한 내부망 서비스로 배포한다
      (`docs/ARCHITECTURE.md` §6, `AI_AGENT.md` §3).
    - Compute는 `Strategy`/`User`/`Subscription`을 모른다. 계산 입력을 request에 고정하고 durable runtime
      job/terminal payload만 제한 기간 소유하며 장기 제품 Aggregate/result는 Core가 소유한다.
    - 필드명은 `docs/GLOSSARY.md`의 코드 네이밍을 그대로 따른다. 임의로 축약하거나 동의어로 바꾸지 않는다.

    - Core는 사용자별 quota/rate limit을 소유한다. Compute는 ADR-044의 전역 active-job
      admission capacity만 적용한다.

servers:
  - url: http://compute.internal:8000
    description: 내부망 전용. 외부 노출 금지(`AI_AGENT.md` §3).

security:
  - InternalApiKey: []

tags:
  - name: backtests
    description: 비동기 백테스트 실행 (`docs/USECASES.md`의 `ExecuteBacktest`)
  - name: assets
    description: Asset/Calendar 참조 데이터 및 보류된 시계열 capability (`docs/USECASES.md`, ADR-049)
  - name: trading-review-jobs
    description: Core 전용 normalization/reconciliation/analytics 비동기 runtime (`docs/TRADING_REVIEW_API.md`)
  - name: trading-review-payloads
    description: opaque terminal payload download와 Core persistence acknowledgement

paths:
  /backtests:
    post:
      operationId: createBacktest
      tags: [backtests]
      summary: 백테스트 실행 요청 (항상 비동기, `docs/ARCHITECTURE.md` §6)
      description: |
        요청을 즉시 accept(202)하고 내부 Job Queue로 처리한다. 동기로 결과를 반환하지 않는다
        (`docs/USECASES.md` "주의" 문구, `AI_AGENT.md` §2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBacktestRequest'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 요청 접수됨. 계산은 아직 시작 전이거나 큐에 있음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestAccepted'
        '400':
          description: |
            `Idempotency-Key`가 없거나 UUID v4가 아니거나, StrategyVersion payload가 DSL Validation을 통과하지 못함
            (Asset 존재 여부, Data Availability, Calendar Compatibility, Condition/Window/Lag
            Validity, Execution Asset Availability, Exit Validity — `docs/DOMAIN.md` §1.2 불변식
            및 `docs/USECASES.md`의 `ExecuteBacktest` 설명). 이 경우 Job을 큐에 넣지 않고 즉시
            실패를 반환한다 — Fail-fast는 런타임 데이터 결측(ADR-005 Fatal Error)에만 적용되며,
            입력 자체가 무효면 실행 전에 걸러낸다.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: 동일한 Idempotency-Key가 다른 request payload와 함께 재사용됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Compute의 전역 `PENDING` + `RUNNING` job capacity가 가득 참. 새 job과
            idempotency record는 생성되지 않으며, Core는 `Retry-After` 이후 동일 key로 재시도한다.
          headers:
            Retry-After:
              description: Core가 재시도 전에 기다릴 초 단위 시간.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestCapacityErrorResponse'

  /backtests/{runId}:
    get:
      operationId: getBacktestStatus
      tags: [backtests]
      summary: 백테스트 상태/결과 조회 (Core가 2~3초 간격으로 폴링)
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            상태에 따라 응답 형태가 달라진다. `status`가 `COMPLETED`면 `result`가 반드시 존재하고,
            `FAILED`면 `failureReason`이 반드시 존재한다(`docs/DOMAIN.md` §1.3 불변식과 동일한 규칙을
            Compute 응답에도 적용).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestStatusResponse'
        '404':
          description: |
            존재하지 않는 runId 또는 24시간 Compute runtime retention이 만료되어 정리된 terminal job.
            Core는 이 응답을 근거로 동일한 논리 요청을 다시 제출하지 않는다(ADR-041).
            Core가 acceptance를 기록한 runId라면 `COMPUTE_RUNTIME_STATUS_UNAVAILABLE`로 자신의
            BacktestRun을 종료하고 동시 실행 capacity만 해제한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ Trading Review normalization / reconciliation ============
  /trading-review/normalization-jobs:
    post:
      operationId: createTradingNormalizationJob
      tags: [trading-review-jobs]
      summary: normalization/reconciliation job 생성
      description: same Idempotency-Key/request fingerprint는 같은 Compute job을 반환한다.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTradingNormalizationJobRequest' } } }
      responses:
        '202':
          description: accepted.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobAccepted' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /trading-review/normalization-jobs/{jobId}:
    get:
      operationId: getTradingNormalizationJobStatus
      tags: [trading-review-jobs]
      summary: normalization job polling
      parameters: [ { $ref: '#/components/parameters/TradingComputeJobId' } ]
      responses:
        '200':
          description: terminal failure는 structured failure를 포함한다.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobStatusResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-review/normalization-jobs/{jobId}/result:
    get:
      operationId: getTradingNormalizationJobResult
      tags: [trading-review-jobs]
      summary: completed normalization terminal payload descriptor
      parameters: [ { $ref: '#/components/parameters/TradingComputeJobId' } ]
      responses:
        '200':
          description: opaque payload descriptor; records를 inline하지 않는다.
          content: { application/json: { schema: { $ref: '#/components/schemas/ComputeTerminalResultDescriptor' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }

  /trading-review/normalization-jobs/{jobId}/cancellation:
    post:
      operationId: cancelTradingNormalizationJob
      tags: [trading-review-jobs]
      summary: normalization job best-effort cancellation
      parameters:
        - $ref: '#/components/parameters/TradingComputeJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: cancellation accepted 또는 existing terminal job.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobStatusResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============ Trading Review analytics ============
  /trading-review/analytics-jobs:
    post:
      operationId: createTradingAnalyticsJob
      tags: [trading-review-jobs]
      summary: Behavior Analytics job 생성
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTradingAnalyticsJobRequest' } } }
      responses:
        '202':
          description: accepted.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobAccepted' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /trading-review/analytics-jobs/{jobId}:
    get:
      operationId: getTradingAnalyticsJobStatus
      tags: [trading-review-jobs]
      summary: analytics job polling
      parameters: [ { $ref: '#/components/parameters/TradingComputeJobId' } ]
      responses:
        '200':
          description: status.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobStatusResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-review/analytics-jobs/{jobId}/result:
    get:
      operationId: getTradingAnalyticsJobResult
      tags: [trading-review-jobs]
      summary: completed analytics terminal payload descriptor
      parameters: [ { $ref: '#/components/parameters/TradingComputeJobId' } ]
      responses:
        '200':
          description: opaque payload descriptor.
          content: { application/json: { schema: { $ref: '#/components/schemas/ComputeTerminalResultDescriptor' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResultUnavailable' }

  /trading-review/analytics-jobs/{jobId}/cancellation:
    post:
      operationId: cancelTradingAnalyticsJob
      tags: [trading-review-jobs]
      summary: analytics job best-effort cancellation
      parameters:
        - $ref: '#/components/parameters/TradingComputeJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: cancellation accepted 또는 existing terminal job.
          content: { application/json: { schema: { $ref: '#/components/schemas/TradingComputeJobStatusResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============ Trading Review terminal payload ============
  /trading-review/terminal-payloads/{payloadId}:
    get:
      operationId: downloadTradingReviewTerminalPayload
      tags: [trading-review-payloads]
      summary: Core가 opaque terminal payload를 stream-download
      parameters:
        - name: payloadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: descriptor의 mediaType/byteSize/SHA-256를 검증해야 한다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NormalizationTerminalPayload'
                  - $ref: '#/components/schemas/AnalyticsTerminalPayload'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trading-review/jobs/{jobId}/acknowledgement:
    post:
      operationId: acknowledgeTradingReviewJobResult
      tags: [trading-review-payloads]
      summary: Core 장기 저장 완료 acknowledgement
      description: same acknowledgement는 idempotent no-op이며 ack 뒤 payload는 cleanup 가능하다.
      parameters:
        - $ref: '#/components/parameters/TradingComputeJobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcknowledgeTradingReviewJobResultRequest' } } }
      responses:
        '204': { description: acknowledged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: MVP Asset Universe(5종) 목록과 메타데이터 (`ListAssets`)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /assets/{symbol}/availability:
    get:
      operationId: getAssetAvailability
      tags: [assets]
      summary: 특정 Asset의 상장일/데이터 가용 구간 (`GetAssetAvailability`)
      description: Strategy Builder에서 기간 제약 안내에 사용(`docs/USECASES.md`).
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AssetSymbol'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAvailability'
        '404':
          description: MVP Asset Universe에 없는 symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 지원 Asset이지만 latest published DatasetSnapshot이 없거나 해당 asset data가 없음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetUnavailableErrorResponse'

  /series:
    get:
      operationId: getSeries
      tags: [assets]
      summary: 보류된 다중 자산 시계열 capability (`GetSeries`)
      description: |
        `docs/USECASES.md`의 `GetSeries`(향후 Data Explorer 데이터 소스). 여러 Asset을 동시에 조회할 수 있다.
        ADR-049에 따라 MVP Web은 이 operation을 호출하거나 사용자에게 노출하지 않는다.
        Correlation/Lead-Lag 등 통계 분석은 포함하지 않는다 — 순수 시계열 조회만 지원한다.
        조회 시작 시 하나의 immutable DatasetSnapshot을 선택하며, 이후 최신 데이터는 섞지 않는다(ADR-046).
      x-refinvest-mvp-status: deferred
      parameters:
        - name: symbols
          in: query
          required: true
          description: "쉼표로 구분된 Asset Symbol 목록 (예: `QQQ,BTCUSDT`)"
          schema:
            type: string
          example: "QQQ,BTCUSDT"
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SeriesMetric'
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: datasetSnapshotId
          in: query
          required: false
          description: 과거 재현용 Snapshot ID. 생략하면 요청 시작 시 최신 published Snapshot 하나를 선택한다.
          schema:
            type: string
      responses:
        '200':
          description: |
            Asset별 실제 trading session만 반환하며 공통 날짜를 만들거나 비거래일 값을 채우지 않는다.
            Expected session의 close 결측은 보정하지 않고 503으로 fail-fast한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '400':
          description: 존재하지 않는 symbol, 중복 symbol, 1~5개 범위 초과, start > end, 최대 10년/20,000 point 제한 초과.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 명시한 datasetSnapshotId가 존재하지 않음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Snapshot이 없거나 immutable artifact/expected close가 손상·결측됨.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesDataErrorResponse'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Core가 logical request/dispatch마다 생성하는 1~128자 opaque key. 네트워크 재시도에는 동일 값을
        사용한다. 동일 key와 canonical request는 최초 202 acceptance를 재반환하고, payload가 다르면 409다.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    TradingComputeJobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: malformed request 또는 invalid idempotency key.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: internal API key 인증 실패.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: unknown 또는 terminal retention이 만료된 job/payload.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: idempotency payload, attempt, hash 또는 state conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: exact version/input schema가 지원되지 않거나 semantic precondition 불충족.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ResultUnavailable:
      description: job이 terminal completed가 아니거나 descriptor가 아직 없음.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServiceUnavailable:
      description: temporary dependency 또는 global capacity failure; job은 생성되지 않을 수 있음.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: |
        core-api→compute-api 호출 시 필수(`docs/DECISIONS.md` ADR-017). 배포 인프라의 네트워크 격리(VPC/보안
        그룹, k8s NetworkPolicy 등)와 함께 2중 방어로 사용한다. Key는 코드에 하드코딩하지 않으며,
        배포 인프라가 정해지면 그 인프라의 시크릿 관리 방식을 따른다. 전송 구간 TLS는 이 인증과 별개로
        항상 활성화한다.

  schemas:
    # ---- 공통 값 타입 ----
    AssetSymbol:
      type: string
      enum: [QQQ, SPY, TQQQ, SOXL, BTCUSDT]
      description: MVP Asset Universe 5종(ADR-001, ADR-050).

    ExecutionAssetSymbol:
      type: string
      enum: [QQQ, SPY, TQQQ, SOXL, BTCUSDT]
      description: MVP Asset Universe와 같은 Execution Asset 집합(ADR-001, ADR-050, `docs/DOMAIN.md` §1.2 불변식).

    Percent:
      type: number
      format: double
      description: 0.001 = 0.1% 형태의 소수 비율.
      example: 0.001

    # ---- Trading Review common/runtime ----
    TradingDecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Arbitrary-precision plain decimal; exponent/leading plus 금지.
    TradingSha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    TradingMoney:
      type: object
      required: [amount, currency, sourceScale]
      properties:
        amount: { $ref: '#/components/schemas/TradingDecimalString' }
        currency: { type: string }
        sourceScale: { type: integer, minimum: 0 }
    TradingQuantity:
      type: object
      required: [value, sourceScale]
      properties:
        value: { $ref: '#/components/schemas/TradingDecimalString' }
        sourceScale: { type: integer, minimum: 0 }
    TradingPrice:
      type: object
      required: [value, sourceScale]
      properties:
        value: { $ref: '#/components/schemas/TradingDecimalString' }
        sourceScale: { type: integer, minimum: 0 }
    TradingRational:
      type: object
      required: [numerator, denominator]
      properties:
        numerator: { type: string, pattern: '^-?(0|[1-9][0-9]*)$' }
        denominator: { type: string, pattern: '^[1-9][0-9]*$' }
    TradingStructuredFailure:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: '#/components/schemas/TradingReviewComputeFailureCode' }
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items:
            type: object
            required: [field, reason]
            additionalProperties: false
            properties:
              field: { type: string }
              reason: { type: string }
              rowNumber: { type: integer, minimum: 1 }
              artifactRole: { type: string, enum: [TRADE_HISTORY, POSITION_HISTORY] }
      description: raw value/identifier/filename/path/URL 없는 safe failure.
    TradingReviewComputeFailureCode:
      type: string
      enum:
        - FILE_FORMAT_INVALID
        - REQUIRED_COLUMN_MISSING
        - UNSUPPORTED_SOURCE_SCHEMA
        - UNSUPPORTED_PRODUCT
        - UNSUPPORTED_POSITION_MODE
        - RECORD_CONFLICT
        - ARTIFACT_REFERENCE_EXPIRED
        - ARTIFACT_ACCESS_DENIED
        - VERSION_UNAVAILABLE
        - VERSION_INCOMPATIBLE
        - CANONICAL_SCHEMA_INCOMPATIBLE
        - INSTRUMENT_TERMS_UNAVAILABLE
        - INVALID_ANALYSIS_CONFIG
        - MISSING_CAPABILITY
        - INCOMPLETE_ANALYSIS_RESULT
        - RESULT_HASH_MISMATCH
        - STALE_RESULT_AFTER_DELETION
        - JOB_CANCELLED
        - TEMPORARY_DEPENDENCY_FAILURE
        - INTERNAL_ERROR
    TradingComputeJobKind:
      type: string
      enum: [NORMALIZATION_RECONCILIATION, ANALYTICS]
    TradingComputeJobAccepted:
      type: object
      required: [jobId, coreLogicalJobId, kind, status, createdAt]
      properties:
        jobId: { type: string }
        coreLogicalJobId: { type: string }
        kind: { $ref: '#/components/schemas/TradingComputeJobKind' }
        status: { type: string, enum: [PENDING] }
        createdAt: { type: string, format: date-time }
    TradingComputeJobStatusBase:
      type: object
      required: [jobId, coreLogicalJobId, kind, progressStage, attempt, createdAt, updatedAt]
      properties:
        jobId: { type: string }
        coreLogicalJobId: { type: string }
        kind: { $ref: '#/components/schemas/TradingComputeJobKind' }
        progressStage: { type: string }
        attempt: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    TradingComputeJobNonTerminal:
      allOf:
        - $ref: '#/components/schemas/TradingComputeJobStatusBase'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [PENDING, RUNNING] }
    TradingComputeJobCompleted:
      allOf:
        - $ref: '#/components/schemas/TradingComputeJobStatusBase'
        - type: object
          required: [status, terminalPayloadId, resultHash, terminalAt]
          properties:
            status: { type: string, enum: [COMPLETED] }
            terminalPayloadId: { type: string }
            resultHash: { $ref: '#/components/schemas/TradingSha256' }
            terminalAt: { type: string, format: date-time }
    TradingComputeJobFailed:
      allOf:
        - $ref: '#/components/schemas/TradingComputeJobStatusBase'
        - type: object
          required: [status, failure, terminalAt]
          properties:
            status: { type: string, enum: [FAILED] }
            failure: { $ref: '#/components/schemas/TradingStructuredFailure' }
            terminalAt: { type: string, format: date-time }
    TradingComputeJobCancelled:
      allOf:
        - $ref: '#/components/schemas/TradingComputeJobStatusBase'
        - type: object
          required: [status, terminalAt]
          properties:
            status: { type: string, enum: [CANCELLED] }
            terminalAt: { type: string, format: date-time }
    TradingComputeJobStatusResponse:
      oneOf:
        - $ref: '#/components/schemas/TradingComputeJobNonTerminal'
        - $ref: '#/components/schemas/TradingComputeJobCompleted'
        - $ref: '#/components/schemas/TradingComputeJobFailed'
        - $ref: '#/components/schemas/TradingComputeJobCancelled'
      discriminator:
        propertyName: status
        mapping:
          PENDING: '#/components/schemas/TradingComputeJobNonTerminal'
          RUNNING: '#/components/schemas/TradingComputeJobNonTerminal'
          COMPLETED: '#/components/schemas/TradingComputeJobCompleted'
          FAILED: '#/components/schemas/TradingComputeJobFailed'
          CANCELLED: '#/components/schemas/TradingComputeJobCancelled'
    ComputeTerminalResultDescriptor:
      type: object
      required: [jobId, coreLogicalJobId, payloadId, mediaType, byteSize, payloadSha256, inputHash, versionSetHash, resultHash, createdAt, expiresAt]
      properties:
        jobId: { type: string }
        coreLogicalJobId: { type: string }
        payloadId: { type: string }
        mediaType:
          type: string
          enum: [application/vnd.refinvest.trading-normalization+json, application/vnd.refinvest.trading-analytics+json]
        byteSize: { type: integer, format: int64, minimum: 1 }
        payloadSha256: { $ref: '#/components/schemas/TradingSha256' }
        inputHash: { $ref: '#/components/schemas/TradingSha256' }
        versionSetHash: { $ref: '#/components/schemas/TradingSha256' }
        resultHash: { $ref: '#/components/schemas/TradingSha256' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: terminalAt + 최대 PT24H 이내. }
    AcknowledgeTradingReviewJobResultRequest:
      type: object
      required: [coreAggregateId, payloadId, payloadSha256, terminalResultHash, persistedAt]
      additionalProperties: false
      properties:
        coreAggregateId: { type: string }
        payloadId: { type: string }
        payloadSha256: { $ref: '#/components/schemas/TradingSha256' }
        terminalResultHash: { $ref: '#/components/schemas/TradingSha256' }
        persistedAt: { type: string, format: date-time }

    ArtifactRole:
      type: string
      enum: [TRADE_HISTORY, POSITION_HISTORY]
    InternalArtifactCoverage:
      type: object
      required: [artifactRole, earliestObservedAt, latestObservedAt, rowCount, sourceTimezone, timestampPrecision, coverageCompleteness]
      additionalProperties: false
      properties:
        artifactRole: { $ref: '#/components/schemas/ArtifactRole' }
        earliestObservedAt: { type: string, format: date-time, nullable: true }
        latestObservedAt: { type: string, format: date-time, nullable: true }
        rowCount: { type: integer, format: int64, minimum: 0 }
        sourceTimezone: { type: string }
        timestampPrecision: { type: string, enum: [SECOND] }
        coverageCompleteness: { type: string, enum: [NOT_PROVEN] }
      description: Trade는 Time min/max, Position은 Opened min/Closed max인 observed coverage; 거래소 export의 연속성·완전성을 증명하지 않는다.
    ArtifactReadGrant:
      type: object
      required: [coreArtifactId, role, rawSha256, byteSize, contentType, accessUri, expiresAt]
      properties:
        coreArtifactId: { type: string }
        role: { $ref: '#/components/schemas/ArtifactRole' }
        rawSha256: { $ref: '#/components/schemas/TradingSha256' }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
        contentType: { type: string, enum: [text/csv, application/vnd.ms-excel] }
        accessUri: { type: string, format: uri, description: 최대 5분 single-read job-bound signed internal URI; log 금지. }
        expiresAt: { type: string, format: date-time }
    TradingBookProduct:
      type: object
      required: [venue, productFamily, positionMode, settlementAsset]
      properties:
        venue: { type: string, enum: [BINANCE] }
        productFamily: { type: string, enum: [LINEAR_PERPETUAL] }
        positionMode: { type: string, enum: [ONE_WAY] }
        settlementAsset: { type: string, enum: [USDT] }
    PinnedInstrumentTerms:
      type: object
      required: [instrumentId, venueSymbol, settlementAsset, quantityStep, priceTick, contractMultiplier, settlementPrecision, instrumentTermsVersion]
      properties:
        instrumentId: { type: string }
        venueSymbol: { type: string, description: lossless opaque source symbol; trim/case/Unicode normalization 금지. }
        settlementAsset: { type: string }
        quantityStep: { $ref: '#/components/schemas/TradingDecimalString' }
        priceTick: { $ref: '#/components/schemas/TradingDecimalString' }
        contractMultiplier: { $ref: '#/components/schemas/TradingDecimalString' }
        settlementPrecision: { type: integer, minimum: 0 }
        instrumentTermsVersion: { type: string }
    InternalNormalizerVersionSet:
      type: object
      required: [sourceDialectVersionsByArtifactRole, adapterVersion, normalizerVersion, canonicalSchemaVersion, reconstructionPolicyVersion, reconciliationVersion, reviewUnitSchemaVersion, evidenceSchemaVersion, implementationDigest, versionSetHash]
      properties:
        sourceDialectVersionsByArtifactRole:
          type: object
          required: [TRADE_HISTORY, POSITION_HISTORY]
          properties:
            TRADE_HISTORY: { type: string }
            POSITION_HISTORY: { type: string }
        adapterVersion: { type: string }
        normalizerVersion: { type: string }
        canonicalSchemaVersion: { type: string }
        reconstructionPolicyVersion: { type: string }
        reconciliationVersion: { type: string }
        reviewUnitSchemaVersion: { type: string }
        evidenceSchemaVersion: { type: string }
        implementationDigest: { type: string }
        versionSetHash: { $ref: '#/components/schemas/TradingSha256' }
    CreateTradingNormalizationJobRequest:
      type: object
      required: [coreLogicalJobId, coreImportSessionId, bookProduct, artifacts, sourceTimezone, reviewTimezone, targetVersionSet, pinnedInstrumentTerms, expectedInputHash, deletionGeneration, attemptToken]
      additionalProperties: false
      properties:
        coreLogicalJobId: { type: string }
        coreImportSessionId: { type: string }
        bookProduct: { $ref: '#/components/schemas/TradingBookProduct' }
        artifacts:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ArtifactReadGrant' }
          description: role별 정확히 하나.
        sourceTimezone: { type: string }
        reviewTimezone: { type: string }
        targetVersionSet: { $ref: '#/components/schemas/InternalNormalizerVersionSet' }
        pinnedInstrumentTerms: { type: array, items: { $ref: '#/components/schemas/PinnedInstrumentTerms' } }
        expectedInputHash: { $ref: '#/components/schemas/TradingSha256' }
        deletionGeneration: { type: integer, format: int64, minimum: 0 }
        attemptToken: { type: string }
    CorePayloadReference:
      type: object
      required: [coreReferenceId, mediaType, byteSize, sha256, accessUri, expiresAt]
      properties:
        coreReferenceId: { type: string }
        mediaType: { type: string }
        byteSize: { type: integer, format: int64, minimum: 1 }
        sha256: { $ref: '#/components/schemas/TradingSha256' }
        accessUri: { type: string, format: uri, description: job-bound internal read; public 노출/log 금지. }
        expiresAt: { type: string, format: date-time }
    InternalAnalysisConfig:
      type: object
      required: [schemaVersion, analysisPeriod, reviewTimezone, timezoneDatabaseVersion, outcomeBasis, fundingTreatment, eligibleReviewUnitPolicy, reversalTreatment, reentryWindow, baselinePolicy, metricMinimums, findingMinimums]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, enum: [1] }
        analysisPeriod:
          type: object
          required: [startInclusive, endExclusive]
          properties:
            startInclusive: { type: string, format: date-time }
            endExclusive: { type: string, format: date-time }
        reviewTimezone: { type: string }
        timezoneDatabaseVersion: { type: string }
        outcomeBasis: { type: string, enum: [NET_TRADING_PNL] }
        fundingTreatment: { type: string, enum: [EXCLUDED] }
        eligibleReviewUnitPolicy: { type: string, enum: [COMPLETE_AND_RECONCILED_ONLY] }
        reversalTreatment: { type: string, enum: [SEPARATE] }
        reentryWindow: { type: string, enum: [PT30M] }
        baselinePolicy: { type: string, enum: [PRIOR_PERIOD_SAME_INSTRUMENT_DIRECTION] }
        metricMinimums:
          type: object
          required: [reentryEligibleLosses, exposurePairs, priorBaselineEpisodes, holdingWins, holdingLosses]
          additionalProperties: false
          properties:
            reentryEligibleLosses: { type: integer, minimum: 1 }
            exposurePairs: { type: integer, minimum: 1 }
            priorBaselineEpisodes: { type: integer, minimum: 1 }
            holdingWins: { type: integer, minimum: 1 }
            holdingLosses: { type: integer, minimum: 1 }
        findingMinimums:
          type: object
          required: [reentryEligibleLosses, exposurePairs, holdingWins, holdingLosses]
          additionalProperties: false
          properties:
            reentryEligibleLosses: { type: integer, minimum: 1 }
            exposurePairs: { type: integer, minimum: 1 }
            holdingWins: { type: integer, minimum: 1 }
            holdingLosses: { type: integer, minimum: 1 }
    InternalAnalyticsVersionSet:
      type: object
      required: [metricDefinitionVersionsByMetricId, findingRuleSetVersion, analysisConfigVersion, evidenceSchemaVersion, implementationDigest, versionSetHash]
      properties:
        metricDefinitionVersionsByMetricId:
          type: object
          required: [ENTRY_WITHIN_WINDOW_AFTER_LOSS, INITIAL_EXPOSURE_CHANGE_AFTER_LOSS, WIN_LOSS_HOLDING_DURATION_DIFFERENCE]
          properties:
            ENTRY_WITHIN_WINDOW_AFTER_LOSS: { type: string }
            INITIAL_EXPOSURE_CHANGE_AFTER_LOSS: { type: string }
            WIN_LOSS_HOLDING_DURATION_DIFFERENCE: { type: string }
        findingRuleSetVersion: { type: string }
        analysisConfigVersion: { type: string }
        evidenceSchemaVersion: { type: string }
        implementationDigest: { type: string }
        versionSetHash: { $ref: '#/components/schemas/TradingSha256' }
    InternalAnalysisCapability:
      type: string
      enum: [CLOSED_OUTCOME, INITIAL_EXPOSURE, MAX_EXPOSURE, POSITION_INCREASES, FEES, FUNDING_PAYMENTS, MARKET_PRICE_PATH, VENUE_REPORTED_PNL, POSITION_MODE_USER_DECLARED, POSITION_MODE_OBSERVED_COMPATIBLE, VENUE_POSITION_SUMMARY, EXECUTION_ORIGIN_KNOWN, STABLE_EPISODE_TIME]
    CreateTradingAnalyticsJobRequest:
      type: object
      required: [coreLogicalJobId, coreAnalysisRunId, ledgerRevisionId, ledgerRevisionContent, reconciliationManifest, targetVersionSet, analysisConfig, analysisConfigHash, capabilitySnapshot, expectedInputHash, deletionGeneration, attemptToken]
      additionalProperties: false
      properties:
        coreLogicalJobId: { type: string }
        coreAnalysisRunId: { type: string }
        ledgerRevisionId: { type: string }
        ledgerRevisionContent: { $ref: '#/components/schemas/CorePayloadReference' }
        reconciliationManifest: { $ref: '#/components/schemas/CorePayloadReference' }
        targetVersionSet: { $ref: '#/components/schemas/InternalAnalyticsVersionSet' }
        analysisConfig: { $ref: '#/components/schemas/InternalAnalysisConfig' }
        analysisConfigHash: { $ref: '#/components/schemas/TradingSha256' }
        capabilitySnapshot: { type: array, items: { $ref: '#/components/schemas/InternalAnalysisCapability' } }
        expectedInputHash: { $ref: '#/components/schemas/TradingSha256' }
        deletionGeneration: { type: integer, format: int64, minimum: 0 }
        attemptToken: { type: string }

    # ---- Normalization terminal payload ----
    InternalSourceEvidenceSnapshot:
      type: object
      required: [snapshotId, coreArtifactId, artifactRole, sourceRowNumber, sourceRowHash, dialect, maskingPolicyVersion, allowlistedFields, capturedAt]
      properties:
        snapshotId: { type: string }
        coreArtifactId: { type: string }
        artifactRole: { $ref: '#/components/schemas/ArtifactRole' }
        sourceRowNumber: { type: integer, minimum: 1 }
        sourceRowHash: { $ref: '#/components/schemas/TradingSha256' }
        dialect: { type: string }
        maskedTradeId: { type: string, nullable: true }
        maskedOrderId: { type: string, nullable: true }
        maskingPolicyVersion: { type: string }
        allowlistedFields:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        capturedAt: { type: string, format: date-time }
    CanonicalRecordBase:
      type: object
      required: [recordId, instrumentId, sourceEvidenceSnapshotId, recordHash]
      properties:
        recordId: { type: string }
        instrumentId: { type: string }
        sourceEvidenceSnapshotId: { type: string }
        recordHash: { $ref: '#/components/schemas/TradingSha256' }
    CanonicalExecutionRecord:
      allOf:
        - $ref: '#/components/schemas/CanonicalRecordBase'
        - type: object
          required: [recordType, sourceExecutionKey, occurredAt, side, price, quantity, executionOrigin]
          properties:
            recordType: { type: string, enum: [EXECUTION] }
            sourceExecutionKey: { type: string, description: versioned account fingerprint + lossless symbol + raw Trade ID의 opaque canonical identity; raw UID 없음. }
            occurredAt: { type: string, format: date-time }
            side: { type: string, enum: [BUY, SELL] }
            price: { $ref: '#/components/schemas/TradingPrice' }
            quantity: { $ref: '#/components/schemas/TradingQuantity' }
            executionOrigin: { type: string, enum: [UNKNOWN] }
    CanonicalFeeRecord:
      allOf:
        - $ref: '#/components/schemas/CanonicalRecordBase'
        - type: object
          required: [recordType, sourceExecutionKey, occurredAt, sourceAmount, feeKind]
          properties:
            recordType: { type: string, enum: [FEE] }
            sourceExecutionKey: { type: string }
            occurredAt: { type: string, format: date-time }
            sourceAmount: { $ref: '#/components/schemas/TradingMoney' }
            feeKind: { type: string, enum: [COST, REBATE, ZERO] }
    CanonicalPnlRecord:
      allOf:
        - $ref: '#/components/schemas/CanonicalRecordBase'
        - type: object
          required: [recordType, sourceExecutionKey, occurredAt, realizedPnl]
          properties:
            recordType: { type: string, enum: [VENUE_REPORTED_PNL] }
            sourceExecutionKey: { type: string }
            occurredAt: { type: string, format: date-time }
            realizedPnl: { $ref: '#/components/schemas/TradingMoney' }
    CanonicalPositionSummaryRecord:
      allOf:
        - $ref: '#/components/schemas/CanonicalRecordBase'
        - type: object
          required: [recordType, openedAt, closedAt, direction, marginMode, entryPrice, averageClosePrice, maxOpenInterest, closedVolume, closingPnl, sourceStatus]
          properties:
            recordType: { type: string, enum: [VENUE_POSITION_SUMMARY] }
            openedAt: { type: string, format: date-time, description: second-precision source local timestamp를 pinned timezone으로 변환한 exact UTC instant. }
            closedAt: { type: string, format: date-time, description: second-precision source local timestamp를 pinned timezone으로 변환한 exact UTC instant. }
            direction: { type: string, enum: [LONG, SHORT] }
            marginMode: { type: string, enum: [ISOLATED, CROSS] }
            entryPrice: { $ref: '#/components/schemas/TradingPrice' }
            averageClosePrice: { $ref: '#/components/schemas/TradingPrice' }
            maxOpenInterest: { $ref: '#/components/schemas/TradingQuantity' }
            closedVolume: { $ref: '#/components/schemas/TradingQuantity' }
            closingPnl: { $ref: '#/components/schemas/TradingMoney' }
            sourceStatus: { type: string, enum: [CLOSED] }
    CanonicalTradingRecord:
      oneOf:
        - $ref: '#/components/schemas/CanonicalExecutionRecord'
        - $ref: '#/components/schemas/CanonicalFeeRecord'
        - $ref: '#/components/schemas/CanonicalPnlRecord'
        - $ref: '#/components/schemas/CanonicalPositionSummaryRecord'
      discriminator:
        propertyName: recordType
        mapping:
          EXECUTION: '#/components/schemas/CanonicalExecutionRecord'
          FEE: '#/components/schemas/CanonicalFeeRecord'
          VENUE_REPORTED_PNL: '#/components/schemas/CanonicalPnlRecord'
          VENUE_POSITION_SUMMARY: '#/components/schemas/CanonicalPositionSummaryRecord'
    InternalPositionAllocation:
      type: object
      required: [recordId, reviewUnitId, action, allocatedQuantity]
      properties:
        recordId: { type: string }
        reviewUnitId: { type: string }
        action: { type: string, enum: [OPEN, INCREASE, REDUCE, CLOSE, REVERSAL_CLOSE, REVERSAL_OPEN] }
        allocatedQuantity: { $ref: '#/components/schemas/TradingQuantity' }
        allocatedFee:
          allOf: [ { $ref: '#/components/schemas/TradingMoney' } ]
          type: object
          nullable: true
        allocatedReportedPnl:
          allOf: [ { $ref: '#/components/schemas/TradingMoney' } ]
          type: object
          nullable: true
    InternalReviewUnit:
      type: object
      required: [reviewUnitId, type, instrumentId, direction, outcomeClassification, reconstructionStatus, reconciliationStatus, allocations, capability]
      properties:
        reviewUnitId: { type: string }
        type: { type: string, enum: [FUTURES_POSITION_EPISODE] }
        instrumentId: { type: string }
        direction: { type: string, enum: [LONG, SHORT] }
        openedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        initialQuantity:
          allOf: [ { $ref: '#/components/schemas/TradingQuantity' } ]
          type: object
          nullable: true
        initialNotional:
          allOf: [ { $ref: '#/components/schemas/TradingMoney' } ]
          type: object
          nullable: true
        outcomeClassification: { type: string, enum: [LOSS, BREAKEVEN, WIN, UNAVAILABLE] }
        netTradingPnl:
          allOf: [ { $ref: '#/components/schemas/TradingMoney' } ]
          type: object
          nullable: true
        reconstructionStatus: { type: string, enum: [COMPLETE, LEFT_CENSORED, RIGHT_CENSORED, INCONSISTENT, UNSUPPORTED] }
        reconciliationStatus: { type: string, enum: [EXACT, WITHIN_ROUNDING_TOLERANCE, AMBIGUOUS, INCOMPLETE_TRADES, SUMMARY_MISMATCH, UNSUPPORTED_OVERLAP] }
        allocations: { type: array, items: { $ref: '#/components/schemas/InternalPositionAllocation' } }
        capability: { type: array, items: { $ref: '#/components/schemas/InternalAnalysisCapability' } }
        exclusionReasons: { type: array, items: { type: string } }
    ReconciliationManifestPayload:
      type: object
      required: [manifestVersion, inputHash, manifestHash, reconstructionPolicyVersion, reconciliationVersion, reviewUnits, capability, quantityConservationPassed, cashFlowConservationPassed]
      properties:
        manifestVersion: { type: string }
        inputHash: { $ref: '#/components/schemas/TradingSha256' }
        manifestHash: { $ref: '#/components/schemas/TradingSha256' }
        reconstructionPolicyVersion: { type: string }
        reconciliationVersion: { type: string }
        reviewUnits: { type: array, items: { $ref: '#/components/schemas/InternalReviewUnit' } }
        capability: { type: array, items: { $ref: '#/components/schemas/InternalAnalysisCapability' } }
        quantityConservationPassed: { type: boolean }
        cashFlowConservationPassed: { type: boolean }
    InternalValidationIssue:
      type: object
      required: [code, severity, artifactRole]
      properties:
        code: { type: string }
        severity: { type: string, enum: [WARNING, ERROR] }
        artifactRole: { $ref: '#/components/schemas/ArtifactRole' }
        sourceRowNumber: { type: integer, minimum: 1, nullable: true }
        field: { type: string, nullable: true }
      description: raw offending value 없음.
    InternalQualityReport:
      type: object
      required: [qualityStatus, rowCountsByArtifactRole, ignoredNonTradingRowCounts, validationIssues, reconciliationStatusCounts, excludedReasonCounts]
      properties:
        qualityStatus: { type: string, enum: [ACCEPTABLE, ACCEPTABLE_WITH_EXCLUSIONS, REJECTED] }
        rowCountsByArtifactRole:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        ignoredNonTradingRowCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        validationIssues: { type: array, items: { $ref: '#/components/schemas/InternalValidationIssue' } }
        reconciliationStatusCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        excludedReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    NormalizationTerminalPayload:
      type: object
      required: [jobId, coreLogicalJobId, coreImportSessionId, status, versionSet, inputHash, artifactCoverages, canonicalRecords, sourceEvidenceSnapshots, reconciliationManifest, capability, qualityReport, ledgerContentHash, resultHash, createdAt, terminalAt]
      properties:
        jobId: { type: string }
        coreLogicalJobId: { type: string }
        coreImportSessionId: { type: string }
        status: { type: string, enum: [COMPLETED] }
        versionSet: { $ref: '#/components/schemas/InternalNormalizerVersionSet' }
        inputHash: { $ref: '#/components/schemas/TradingSha256' }
        artifactCoverages:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/InternalArtifactCoverage' }
          description: TRADE_HISTORY와 POSITION_HISTORY role별 정확히 하나.
        canonicalRecords: { type: array, items: { $ref: '#/components/schemas/CanonicalTradingRecord' } }
        sourceEvidenceSnapshots: { type: array, items: { $ref: '#/components/schemas/InternalSourceEvidenceSnapshot' } }
        reconciliationManifest: { $ref: '#/components/schemas/ReconciliationManifestPayload' }
        capability: { type: array, items: { $ref: '#/components/schemas/InternalAnalysisCapability' } }
        qualityReport: { $ref: '#/components/schemas/InternalQualityReport' }
        ledgerContentHash: { $ref: '#/components/schemas/TradingSha256' }
        resultHash: { $ref: '#/components/schemas/TradingSha256' }
        createdAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }

    # ---- Analytics terminal payload ----
    InternalMetricStatus:
      type: string
      enum: [AVAILABLE, INSUFFICIENT_SAMPLE, MISSING_CAPABILITY, NOT_APPLICABLE]
    InternalBehaviorObservation:
      type: object
      required: [observationId, definitionId, definitionVersion, subjectReviewUnitIds, observedAt, attributes, evidenceRecordIds]
      properties:
        observationId: { type: string }
        definitionId: { type: string, enum: [ENTRY_WITHIN_WINDOW_AFTER_LOSS, INITIAL_EXPOSURE_CHANGE_AFTER_LOSS, WIN_LOSS_HOLDING_DURATION_DIFFERENCE] }
        definitionVersion: { type: string }
        subjectReviewUnitIds: { type: array, items: { type: string } }
        observedAt: { type: string, format: date-time }
        attributes:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        evidenceRecordIds: { type: array, items: { type: string } }
    InternalBehaviorMetric:
      type: object
      required: [metricId, definitionId, definitionVersion, status, findingEligibility, populationCount, eligibleCount, excludedCount, excludedReasonCounts, subjectReviewUnitIds, comparisonReviewUnitIds, capabilitySnapshot, result, evidenceReference, metricHash]
      properties:
        metricId: { type: string }
        definitionId: { type: string, enum: [ENTRY_WITHIN_WINDOW_AFTER_LOSS, INITIAL_EXPOSURE_CHANGE_AFTER_LOSS, WIN_LOSS_HOLDING_DURATION_DIFFERENCE] }
        definitionVersion: { type: string }
        status: { $ref: '#/components/schemas/InternalMetricStatus' }
        findingEligibility: { type: string, enum: [ELIGIBLE, INELIGIBLE_SAMPLE, INELIGIBLE_METRIC_STATUS] }
        populationCount: { type: integer, format: int64, minimum: 0 }
        eligibleCount: { type: integer, format: int64, minimum: 0 }
        excludedCount: { type: integer, format: int64, minimum: 0 }
        excludedReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        subjectReviewUnitIds: { type: array, items: { type: string } }
        comparisonReviewUnitIds: { type: array, items: { type: string } }
        capabilitySnapshot: { type: array, items: { $ref: '#/components/schemas/InternalAnalysisCapability' } }
        result:
          type: object
          properties:
            decimal:
              allOf: [ { $ref: '#/components/schemas/TradingDecimalString' } ]
              type: string
              nullable: true
            ratio:
              allOf: [ { $ref: '#/components/schemas/TradingRational' } ]
              type: object
              nullable: true
            durationMicroseconds: { type: integer, format: int64, minimum: 0, nullable: true }
        evidenceReference: { type: string }
        metricHash: { $ref: '#/components/schemas/TradingSha256' }
    InternalBehaviorFinding:
      type: object
      required: [findingId, definitionId, definitionVersion, observation, evidenceMetricIds, supportingReviewUnitIds, comparisonReviewUnitIds, sampleAssessment, rankReason]
      properties:
        findingId: { type: string }
        definitionId: { type: string }
        definitionVersion: { type: string }
        observation: { type: string }
        evidenceMetricIds: { type: array, items: { type: string } }
        supportingReviewUnitIds: { type: array, items: { type: string } }
        comparisonReviewUnitIds: { type: array, items: { type: string } }
        sampleAssessment: { type: string, enum: [INSUFFICIENT, LIMITED, DESCRIPTIVE] }
        rankReason: { type: string }
    InternalEvidenceMembership:
      type: object
      required: [metricId, reviewUnitId, role, allocationRecordIds, sourceEvidenceSnapshotIds]
      properties:
        metricId: { type: string }
        reviewUnitId: { type: string }
        role: { type: string, enum: [SUPPORTING, COMPARISON, EXCLUDED_CANDIDATE, SELECTION_BOUNDARY] }
        exclusionReason: { type: string, nullable: true }
        allocationRecordIds: { type: array, items: { type: string } }
        sourceEvidenceSnapshotIds: { type: array, items: { type: string } }
    AnalyticsTerminalPayload:
      type: object
      required: [jobId, coreLogicalJobId, coreAnalysisRunId, status, versionSet, analysisConfig, analysisConfigHash, inputHash, reviewUnits, observations, metrics, findings, evidenceMembership, populationCount, eligibleCount, excludedCount, exclusionReasonCounts, evidenceHash, resultHash, createdAt, terminalAt]
      properties:
        jobId: { type: string }
        coreLogicalJobId: { type: string }
        coreAnalysisRunId: { type: string }
        status: { type: string, enum: [COMPLETED] }
        versionSet: { $ref: '#/components/schemas/InternalAnalyticsVersionSet' }
        analysisConfig: { $ref: '#/components/schemas/InternalAnalysisConfig' }
        analysisConfigHash: { $ref: '#/components/schemas/TradingSha256' }
        inputHash: { $ref: '#/components/schemas/TradingSha256' }
        reviewUnits: { type: array, items: { $ref: '#/components/schemas/InternalReviewUnit' } }
        observations: { type: array, items: { $ref: '#/components/schemas/InternalBehaviorObservation' } }
        metrics: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/InternalBehaviorMetric' } }
        findings: { type: array, items: { $ref: '#/components/schemas/InternalBehaviorFinding' } }
        evidenceMembership: { type: array, items: { $ref: '#/components/schemas/InternalEvidenceMembership' } }
        populationCount: { type: integer, format: int64, minimum: 0 }
        eligibleCount: { type: integer, format: int64, minimum: 0 }
        excludedCount: { type: integer, format: int64, minimum: 0 }
        exclusionReasonCounts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        evidenceHash: { $ref: '#/components/schemas/TradingSha256' }
        resultHash: { $ref: '#/components/schemas/TradingSha256' }
        createdAt: { type: string, format: date-time }
        terminalAt: { type: string, format: date-time }

    Period:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    # ---- Strategy DSL (docs/DOMAIN.md §1.2) ----
    MetricType:
      type: string
      enum: [SIMPLE, RETURN, CHANGE]
      description: |
        SIMPLE=Simple Comparison(window 없음), RETURN=Lookback, CHANGE=Change
        (`docs/GLOSSARY.md` Condition Metric 타입). Relative는 별도 타입이 아니라
        operandB가 MetricReference인 조합으로 표현된다.

    MetricReference:
      type: object
      required: [asset, metric]
      properties:
        asset:
          $ref: '#/components/schemas/AssetSymbol'
        metric:
          $ref: '#/components/schemas/MetricType'
        window:
          type: integer
          minimum: 1
          nullable: true
          description: SIMPLE은 null. RETURN/CHANGE는 1 이상 필수(`docs/DOMAIN.md` §1.2 불변식).

    ComparisonOperator:
      type: string
      enum: [LT, GT, LTE, GTE]

    LogicalCombinator:
      type: string
      enum: [AND, OR]
      nullable: true
      description: |
        첫 번째 Condition은 null. MVP는 단일 Condition Group만 허용하며 중첩은 없다.
        후속 Condition은 모두 동일한 combinator(전부 AND 또는 전부 OR)를 사용해야 한다.
        혼합 combinator는 DSL_INVALID이며, 모든 condition은 short-circuit 없이 평가된다.

    Condition:
      type: object
      required: [operator, operandA, operandB]
      properties:
        operator:
          $ref: '#/components/schemas/ComparisonOperator'
        logicalCombinator:
          $ref: '#/components/schemas/LogicalCombinator'
        operandA:
          $ref: '#/components/schemas/MetricReference'
        operandB:
          description: MetricReference(Relative 조건) 또는 상수값(Literal).
          oneOf:
            - $ref: '#/components/schemas/MetricReference'
            - type: number

    PositionPolicy:
      type: object
      description: |
        MVP는 아래 값으로 고정된다(ADR-009). Compute가 별도로 검증할 필요는 없지만, Core가
        StrategyVersion 전체를 그대로 전달하는 원칙(`docs/DOMAIN.md` §3)에 따라 payload에 포함한다.
      properties:
        longOnly:
          type: boolean
          enum: [true]
        singlePosition:
          type: boolean
          enum: [true]
        duplicateEntry:
          type: string
          enum: [IGNORE]

    StrategyVersionPayload:
      type: object
      required: [primarySignalAsset, conditions, executionAsset, lag, exit]
      description: |
        `docs/DOMAIN.md` §1.2 StrategyVersion을 그대로 반영한 Compute 요청 payload.
        Core는 StrategyVersionId가 아니라 이 payload 전체를 전달한다(Compute는 Strategy를 모름).
      properties:
        primarySignalAsset:
          $ref: '#/components/schemas/AssetSymbol'
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Condition'
        executionAsset:
          $ref: '#/components/schemas/ExecutionAssetSymbol'
        lag:
          type: integer
          minimum: 0
          description: Primary Signal Asset 기준 Signal Sessions(ADR-003).
        exit:
          type: object
          required: [holdingSignalSessions]
          properties:
            holdingSignalSessions:
              type: integer
              minimum: 1
          description: MVP는 Time-based Exit만 허용(ADR-008).
        positionPolicy:
          $ref: '#/components/schemas/PositionPolicy'

    FeeModel:
      type: object
      required: [commission, slippage]
      properties:
        commission:
          $ref: '#/components/schemas/Percent'
        slippage:
          $ref: '#/components/schemas/Percent'
      description: |
        체결 규칙(ADR-010): Reference Price = Execution Session Open,
        매수 = Open × (1 + slippage), 매도 = Open × (1 - slippage).

    CreateBacktestRequest:
      type: object
      required: [strategyVersion, feeModel, period]
      properties:
        strategyVersionId:
          type: string
          description: |
            Core 내부 참조용 식별자. Compute는 이 값을 해석하지 않고 응답에 그대로 echo한다
            (Core가 콜백 없는 폴링으로 결과를 자기 BacktestRun에 매핑하기 위함).
        strategyVersion:
          $ref: '#/components/schemas/StrategyVersionPayload'
        feeModel:
          $ref: '#/components/schemas/FeeModel'
        period:
          $ref: '#/components/schemas/Period'
        datasetSnapshotId:
          type: string
          nullable: true
          description: |
            명시하면 해당 Snapshot을 강제 사용(과거 백테스트 재현용, ADR-010). 생략하면 Compute가
            최신 Snapshot을 선택한다(`docs/DOMAIN.md` §3 step 3).

    BacktestAccepted:
      type: object
      required: [runId, status]
      properties:
        runId:
          type: string
        strategyVersionId:
          type: string
          description: 요청에 포함됐다면 그대로 echo.
        status:
          type: string
          enum: [PENDING]

    BacktestStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      description: |
        Compute job의 상태 전이는 PENDING → RUNNING → (COMPLETED | FAILED)만 허용하며 역방향 전이는 없다.
        이는 Core의 `BacktestRun` 상태 전이와 구분된다. Compute가 job을 접수하기 전에 영구적으로
        거절된 경우 Core는 ADR-047에 따라 자신의 `BacktestRun`을 PENDING → FAILED로 전이할 수 있지만,
        해당 Compute job은 존재하지 않으므로 이 API에서 관측되지 않는다.

    FatalErrorCode:
      type: string
      enum:
        - MISSING_REQUIRED_DATA
        - DATASET_CORRUPTION
        - CALENDAR_RESOLUTION_FAILED
        - PRICE_DATA_MISSING
        - EXECUTION_TIMEOUT
        - DSL_INVALID
      description: |
        데이터/계산 fatal error와 terminal execution timeout의 Compute error code. 시간 제한은
        ADR-042에 정의되며, 이 목록 변경은 관련 ADR과 함께 계약으로 검토한다.

    BacktestResultMetrics:
      type: object
      description: |
        `sampleSizeWarning`이 `ZERO`이면 `tradeCount`를 제외한 전략 성과 지표는 계산 불가능하므로
        `null`이다. Web/Core는 이를 `0`으로 대체하지 않고 Empty State로 표시한다(ADR-006).
        Compute는 계산된 raw 값을 그대로 반환한다.
      properties:
        totalReturn: { type: number, nullable: true }
        cagr: { type: number, nullable: true }
        mdd: { type: number, nullable: true }
        sharpe: { type: number, nullable: true }
        winRate: { type: number, nullable: true }
        tradeCount: { type: integer }
        avgTradeReturn: { type: number, nullable: true }
        avgHoldingPeriod: { type: number, nullable: true }
        profitFactor: { type: number, nullable: true }

    EquityCurvePoint:
      type: object
      description: |
        pinned DatasetSnapshot으로 계산한 portfolio index point다. `value`의 시작값은 1이며
        원시 close/OHLC가 아니다. Strategy curve는 Execution Asset session별 전략 자본가치,
        Buy & Hold curve는 해당 asset의 첫 available close 대비 Close-to-Close 값이다(ADR-052).
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: number }

    Trade:
      type: object
      required: [signalTime, entryTime, entryPrice, exitTime, exitPrice, returnPct, holdingPeriod]
      properties:
        signalTime: { type: string, format: date-time }
        entryTime: { type: string, format: date-time }
        entryPrice: { type: number }
        exitTime: { type: string, format: date-time }
        exitPrice: { type: number }
        returnPct: { type: number }
        holdingPeriod: { type: integer }

    BuyAndHoldResult:
      type: object
      description: |
        하나의 asset에 대한 cost-free Close-to-Close Buy & Hold reference다. `equityCurve`는
        해당 asset의 독립 session을 보존하는 portfolio index이며, 다른 calendar의 curve와
        공통 date를 합성하거나 forward-fill하지 않는다(ADR-007, ADR-052).
      required: [asset, equityCurve, totalReturn, cagr, mdd]
      properties:
        asset:
          $ref: '#/components/schemas/AssetSymbol'
        equityCurve:
          type: array
          items:
            $ref: '#/components/schemas/EquityCurvePoint'
        totalReturn: { type: number }
        cagr: { type: number, nullable: true }
        mdd: { type: number }

    SignalExecutionMarketRelation:
      type: string
      enum: [SAME_MARKET, CROSS_MARKET]
      description: |
        Primary Signal Asset과 Execution Asset의 calendar가 같으면 SAME_MARKET, 다르면
        CROSS_MARKET이다. Trade의 signal/entry/exit timeline에서 신호와 체결 시장의 관계를
        표시하는 metadata이며, 체결 규칙을 바꾸지 않는다(ADR-003, ADR-052).

    SignalExecutionDelay:
      type: object
      required: [median, max, distribution]
      description: |
        각 거래의 `entryTime - signalTime`을 시간(hours) 단위로 기록한다(ADR-048).
        `distribution`은 거래 입력 순서를 보존하며, `median`은 중앙값(짝수 개면 두 중앙값의 산술 평균),
        `max`는 최댓값이다. 무거래 결과는 빈 배열과 `median = max = 0`을 반환한다.
      properties:
        median: { type: number, minimum: 0 }
        max: { type: number, minimum: 0 }
        distribution:
          type: array
          items: { type: number, minimum: 0 }

    SampleSizeWarning:
      type: string
      enum: [NONE, LOW, ZERO]
      description: Trade Count < 10 → LOW, = 0 → ZERO(ADR-006).

    DataIntegrityStatus:
      type: object
      required: [datasetSnapshotId, corporateActionsApplied, pointInTimeValidationPassed]
      properties:
        datasetSnapshotId:
          type: string
        corporateActionsApplied:
          type: boolean
        pointInTimeValidationPassed:
          type: boolean

    BacktestResult:
      type: object
      required:
        - backtestRunId
        - metrics
        - equityCurve
        - trades
        - benchmark
        - signalExecutionMarketRelation
        - signalExecutionDelay
        - sampleSizeWarning
        - dataIntegrityStatus
      properties:
        backtestRunId: { type: string }
        metrics:
          $ref: '#/components/schemas/BacktestResultMetrics'
        equityCurve:
          type: array
          items:
            $ref: '#/components/schemas/EquityCurvePoint'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        benchmark:
          type: object
          required: [primary]
          properties:
            primary:
              $ref: '#/components/schemas/BuyAndHoldResult'
              description: Execution Asset Buy & Hold(ADR-007).
            secondaryReference:
              $ref: '#/components/schemas/BuyAndHoldResult'
              nullable: true
              description: Primary Signal Asset이 Execution Asset과 다를 때만 존재하는 Signal Asset Buy & Hold(ADR-007, ADR-052).
        signalExecutionMarketRelation:
          $ref: '#/components/schemas/SignalExecutionMarketRelation'
        signalExecutionDelay:
          $ref: '#/components/schemas/SignalExecutionDelay'
        sampleSizeWarning:
          $ref: '#/components/schemas/SampleSizeWarning'
        dataIntegrityStatus:
          $ref: '#/components/schemas/DataIntegrityStatus'

    BacktestStatusResponse:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string }
        strategyVersionId: { type: string }
        status:
          $ref: '#/components/schemas/BacktestStatus'
        datasetSnapshotId:
          type: string
          nullable: true
          description: status가 PENDING이 아니게 되는 시점부터 존재(`docs/DOMAIN.md` §1.3 BacktestRun.datasetSnapshotId).
        actualPeriod:
          allOf:
            - $ref: '#/components/schemas/Period'
          type: object
          nullable: true
          description: Asset Availability 교집합 반영 후의 실제 기간(`docs/DOMAIN.md` §1.3).
        engineVersion:
          type: string
          nullable: true
          description: Compute 컨테이너 버전 태그(ADR-010 Determinism Contract, `docs/ARCHITECTURE.md` §7).
        result:
          $ref: '#/components/schemas/BacktestResult'
          nullable: true
          description: status가 COMPLETED일 때만 존재.
        failureReason:
          type: string
          nullable: true
          description: status가 FAILED일 때만 존재(`docs/DOMAIN.md` §1.3 불변식).
        errorCode:
          $ref: '#/components/schemas/FatalErrorCode'

    # ---- Asset / Series ----
    CorporateActionType:
      type: string
      enum: [SPLIT, REVERSE_SPLIT, DIVIDEND]

    CorporateAction:
      type: object
      required: [type, effectiveDate]
      properties:
        type:
          $ref: '#/components/schemas/CorporateActionType'
        effectiveDate:
          type: string
          format: date
        ratio:
          type: number
          nullable: true
          description: SPLIT/REVERSE_SPLIT에서 사용.
        amount:
          type: number
          nullable: true
          description: DIVIDEND에서 사용.

    Calendar:
      type: string
      enum: [US_EQUITY, CRYPTO_UTC]

    DataAvailability:
      type: object
      required: [firstDate, lastDate]
      properties:
        firstDate: { type: string, format: date }
        lastDate: { type: string, format: date }

    Asset:
      type: object
      required: [symbol, calendar, inceptionDate, executionEnabled]
      properties:
        symbol:
          $ref: '#/components/schemas/AssetSymbol'
        calendar:
          $ref: '#/components/schemas/Calendar'
          description: 시장 구분은 이 값으로 충분하다(US_EQUITY↔주식/ETF, CRYPTO_UTC↔크립토). 별도 market 필드 없음(`docs/DOMAIN.md` §2.1).
        inceptionDate:
          type: string
          format: date
        executionEnabled:
          type: boolean
        dataAvailability:
          $ref: '#/components/schemas/DataAvailability'
          nullable: true
        corporateActions:
          type: array
          items:
            $ref: '#/components/schemas/CorporateAction'

    AssetAvailability:
      type: object
      required: [symbol, inceptionDate, dataAvailability, datasetSnapshotId, snapshotCreatedAt]
      properties:
        symbol:
          $ref: '#/components/schemas/AssetSymbol'
        inceptionDate:
          type: string
          format: date
        dataAvailability:
          $ref: '#/components/schemas/DataAvailability'
        datasetSnapshotId:
          type: string
        snapshotCreatedAt:
          type: string
          format: date-time

    AssetListResponse:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        datasetSnapshotId:
          type: string
          nullable: true
        snapshotCreatedAt:
          type: string
          format: date-time
          nullable: true

    DatasetUnavailableErrorResponse:
      type: object
      required: [message, errorCode]
      properties:
        message:
          type: string
        errorCode:
          type: string
          enum: [DATASET_UNAVAILABLE]

    SeriesDataErrorResponse:
      type: object
      required: [message, errorCode]
      properties:
        message:
          type: string
        errorCode:
          type: string
          enum: [DATASET_UNAVAILABLE, DATASET_CORRUPTION]

    SeriesMetric:
      type: string
      enum: [PRICE, RETURN, NORMALIZED]
      description: |
        PRICE는 close, RETURN은 직전 available session close 대비 일간 수익률, NORMALIZED는
        요청 범위 안 첫 close를 100으로 맞춘 값(ADR-046).

    SeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: number }

    AssetSeries:
      type: object
      required: [symbol, points]
      properties:
        symbol:
          $ref: '#/components/schemas/AssetSymbol'
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'

    SeriesResponse:
      type: object
      required: [datasetSnapshotId, snapshotCreatedAt, adjustmentPolicy, series]
      properties:
        datasetSnapshotId:
          type: string
        snapshotCreatedAt:
          type: string
          format: date-time
        adjustmentPolicy:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/AssetSeries'

    # ---- 공통 에러 ----
    ErrorResponse:
      type: object
      required: [code, message, traceId, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            required: [field, reason]
            additionalProperties: false
            properties:
              field: { type: string }
              reason: { type: string }
              rowNumber: { type: integer, minimum: 1 }
              artifactRole: { type: string, enum: [TRADE_HISTORY, POSITION_HISTORY] }
          description: raw source value/identifier/filename/path/URL 금지.

    ValidationErrorResponse:
      type: object
      required: [message, errorCode]
      properties:
        message:
          type: string
        errorCode:
          $ref: '#/components/schemas/FatalErrorCode'
        details:
          type: array
          items:
            type: string
          description: 실패한 개별 Validation 항목(`docs/DOMAIN.md` §1.2 불변식).

    BacktestCapacityErrorResponse:
      type: object
      required: [message, errorCode]
      properties:
        message:
          type: string
        errorCode:
          type: string
          enum: [BACKTEST_CAPACITY_EXCEEDED]
